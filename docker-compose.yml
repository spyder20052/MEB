# Services annexes de développement.
# La stack Supabase locale est gérée séparément par `npx supabase start`.
services:
  # Serveur SMTP de test : capture tous les e-mails sortants du site.
  # Interface web : http://localhost:8025 — SMTP : localhost:1025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: meb-mailhog
    # Lié à 127.0.0.1 uniquement : invisible depuis le réseau local.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
