# Passerelle Supabase self-hostée (Envoy, supabase/self-host/docker-compose.yml).
# Écoute sur 127.0.0.1:8010 (8000 déjà pris par un autre projet sur ce VPS mutualisé).
# À copier vers /etc/nginx/sites-available/ puis symlinker dans sites-enabled/ sur le serveur.
# Certbot réécrit ce fichier pour ajouter les blocs SSL — voir README de déploiement.
#
# NB : Supabase Studio (dashboard) répond aussi sur ce port mais n'est volontairement PAS
# exposé ici. Y accéder via tunnel SSH : ssh -L 8010:127.0.0.1:8010 root@168.231.83.189
# puis http://localhost:8010 (protégé par DASHBOARD_USERNAME/DASHBOARD_PASSWORD).

server {
    listen 80;
    listen [::]:80;
    server_name api.entrepreneurbenin.pro;

    # Upload de fichiers (Storage) : aligné sur FILE_SIZE_LIMIT (50MiB) côté storage-api.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
