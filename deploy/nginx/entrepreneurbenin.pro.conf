# Site MEB — reverse proxy vers le conteneur Next.js (docker-compose.prod.yml, port 3000).
# À copier vers /etc/nginx/sites-available/ puis symlinker dans sites-enabled/ sur le serveur.
# Certbot réécrit ce fichier pour ajouter les blocs SSL — voir README de déploiement.

server {
    listen 80;
    listen [::]:80;
    server_name entrepreneurbenin.pro www.entrepreneurbenin.pro;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
